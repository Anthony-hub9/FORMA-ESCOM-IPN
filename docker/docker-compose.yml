services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ../frontend:/var/www/frontend:ro
      - ../backend:/var/www/backend:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - rag-service

  php:
    image: php:8.2-fpm-alpine
    working_dir: /var/www/backend
    volumes:
      - ../backend:/var/www/backend
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: forma_db
      MARIADB_USER: forma_user
      MARIADB_PASSWORD: changeme_dev_password
      MARIADB_ROOT_PASSWORD: changeme_root_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  rag-service:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ../rag-service:/app
    ports:
      - "8000:8000"

volumes:
  mariadb_data:
